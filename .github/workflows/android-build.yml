name: Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter ficheiros
        uses: actions/checkout@v4

      - name: Localizar o projecto
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f TacticalTalk.zip ]; then
            unzip -q TacticalTalk.zip -d _work
            echo "PROJECT_DIR=_work/TacticalTalk" >> "$GITHUB_ENV"
          else
            echo "::error::Nao encontrei o projecto. Coloque o TacticalTalk.zip na raiz do repositorio."
            exit 1
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Testes automaticos (cifra e duplicados)
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          gradle :app:testDebugUnitTest --stacktrace

      - name: Compilar APK de depuracao
        run: |
          cd "$PROJECT_DIR"
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee build.log
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/WalkieTalkie-debug.apk"

      - name: Resumo dos erros de compilacao
        if: failure()
        run: |
          cd "$PROJECT_DIR"
          echo "ERROS DE KOTLIN (linhas que comecam por e:)"
          grep -E "^e: " build.log | sed 's#file://.*/app/src/main/java/com/tacticaltalk/app/##' | head -40 || true
          grep -E "^e: " build.log | sed 's#file://.*/app/src/main/java/com/tacticaltalk/app/##' | head -10 | while read -r l; do echo "::error::$l"; done
          echo "OUTROS PROBLEMAS"
          grep -E "What went wrong|error:|Execution failed" -A3 build.log | head -40 || true

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WalkieTalkie-debug
          path: out/WalkieTalkie-debug.apk
          if-no-files-found: error
